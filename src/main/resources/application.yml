server:
  port: 8887

spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/shoppingmall
    username: mall
    password: mall
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update  # 엔티티 기반으로 테이블 자동 생성 및 수정
    show-sql: true       # 실행되는 SQL 콘솔에 출력
    properties:
      hibernate:
        format_sql: true  # SQL 예쁘게 출력